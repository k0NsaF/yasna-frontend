<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ясна | Система управления</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body {
            background-color: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .login-card img {
            height: 70px;
            margin-bottom: 20px;
            border-radius: 8px;
        }
        .login-card h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        .login-card p {
            color: var(--gray);
            font-size: 14px;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <img src="img/yasna-logo.jpg" alt="Ясна">
        <h1>Система управления</h1>
        <p>Вход для мастера столярной мастерской</p>
        
        <!-- Кнопка ведет на страницу авторизации мастера -->
        <button type="button" class="btn btn-block" style="padding: 15px; font-size: 16px;" onclick="window.location.href='master-login.html'">
            Войти в панель управления
        </button>
    </div>

</body>
</html>
