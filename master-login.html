<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Проверка входа</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f9fafb; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; width: 300px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #FFC107; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Вход для мастера</h2>
        <input type="password" id="password" placeholder="Пароль">
        <button onclick="login()">Войти</button>
        <p id="status" style="color: red; font-size: 14px; margin-top: 10px;"></p>
    </div>

    <script>
        async function login() {
            const password = document.getElementById('password').value;
            const status = document.getElementById('status');
            status.innerText = 'Проверяем...';

            try {
                const response = await fetch('https://k0nsaf-foundation-final.hf.space/api/master/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: password })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.detail || 'Ошибка входа');

                localStorage.setItem('master_token', data.access_token);
                window.location.href = 'master.html';

            } catch (err) {
                status.innerText = 'Ошибка: ' + err.message;
            }
        }
    </script>
</body>
</html>
